{% extends "base.html" %}
{% block content %}
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#" data-view="dashboard" aria-label="MEVI Student Portal dashboard">
      <span class="brand-mark">M</span><span class="brand-copy"><strong>MEVI</strong><small>Student Portal</small></span>
    </a>
    <div class="workspace-label">WORKSPACE</div>
    <nav class="main-nav" aria-label="Main navigation">
      <button class="nav-link active" data-view="dashboard"><span class="nav-icon">⌂</span>Dashboard</button>
      <button class="nav-link" data-view="students"><span class="nav-icon">♙</span>Students<span class="nav-count" id="student-nav-count">0</span></button>
      <button class="nav-link" data-view="courses"><span class="nav-icon">▤</span>Courses</button>
      <button class="nav-link" data-view="attendance"><span class="nav-icon">◷</span>Attendance</button>
      <button class="nav-link" data-view="assignments"><span class="nav-icon">☷</span>Assignments</button>
      <button class="nav-link" data-view="announcements"><span class="nav-icon">◉</span>Announcements</button>
    </nav>
    <div class="sidebar-bottom">
      <div class="workspace-label">PREFERENCES</div>
      <button class="nav-link" data-view="settings"><span class="nav-icon">⚙</span>Settings</button>
      <div class="sidebar-profile">
        <div class="avatar avatar-admin">AM</div>
        <div class="profile-copy"><strong>Alex Morgan</strong><small>Administrator</small></div>
        <button class="icon-button logout-button" id="logout-button" aria-label="Sign out" title="Sign out">↗</button>
      </div>
    </div>
  </aside>

  <main class="main-panel">
    <header class="topbar">
      <button class="icon-button menu-button" id="menu-button" aria-label="Toggle navigation">☰</button>
      <div class="breadcrumb"><span>Workspace</span><b>/</b><strong id="current-section">Dashboard</strong></div>
      <div class="topbar-actions">
        <span class="date-label" id="today-label"></span>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
          <span class="theme-toggle-icon" aria-hidden="true">☾</span><span class="theme-toggle-label">Dark mode</span>
        </button>
        <button class="icon-button notification-button" data-view="announcements" aria-label="View announcements" title="Announcements">♧<i></i></button>
        <div class="avatar avatar-admin top-avatar">AM</div>
      </div>
    </header>
    <div class="page-content" id="page-content"></div>
  </main>
</div>
<div class="modal-root" id="modal-root" aria-live="polite"></div>
{% endblock %}
